[project]
name = "short-term-memory-chat"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dhruv Sharma", email = "dhruv.sharma@crossml.com" }
]
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.4.6",
    "langchain-groq>=1.1.3",
    "langfuse>=4.18.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
short-term-memory-chat = "short_term_memory_chat:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
